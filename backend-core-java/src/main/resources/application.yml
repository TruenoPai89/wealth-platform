spring:
  application:
    name: wealth-backend-core
  jackson:
    deserialization:
      # Los decimales del JSON se leen como BigDecimal (nunca double) -> sin perdida de precision
      use-big-decimal-for-floats: true
    generator:
      # BigDecimal se escribe en notacion plana (0.000001 en lugar de 1E-6)
      write-bigdecimal-as-plain: true
    serialization:
      write-dates-as-timestamps: false
  # TODO(PostgreSQL): mientras JEV se lee del mock JSON no hay base de datos.
  # Para conectar PostgreSQL: quitar este exclude, definir spring.datasource.* y poner spring.flyway.enabled=true.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  flyway:
    enabled: false

server:
  # El backend core escucha en 8080 (el frontend apunta a http://localhost:8080/api/v1).
  # OJO: wealth.openjev.base-url tambien apunta a localhost:8080. Si levantas OpenJEV System One en esta misma
  # maquina, mueve uno de los dos (SERVER_PORT=... o WEALTH_OPENJEV_BASE_URL=...) para que no choquen.
  port: 8080

wealth:
  transfers:
    # Retardo de liquidacion simulado: pasado este tiempo, los movimientos pasan de "En proceso" a "Completado".
    settlement-delay-seconds: 20
  cors:
    # Patrones de origen permitidos para /api/** (frontend Next.js en desarrollo). Lista separada por comas.
    # localhost y 127.0.0.1 en cualquier puerto: cubre http://127.0.0.1:3000 y Next en 3001 si el 3000 esta ocupado.
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
  telephony:
    # Llamada de voz con el asesor de IA (ElevenLabs Conversational AI + Twilio).
    # SECRETOS: solo por variables de entorno, NUNCA escritos aqui ni en git. Sin ellas la app arranca igual y los
    # endpoints de llamada responden 503. Ver README del modulo / docs de ElevenLabs para crear el agente y el numero.
    elevenlabs:
      api-key: ${ELEVENLABS_API_KEY:}
      agent-id: ${ELEVENLABS_AGENT_ID:}
      agent-phone-number-id: ${ELEVENLABS_PHONE_NUMBER_ID:}
      timeout-ms: 10000
      ringing-timeout-secs: 45
    # Secreto compartido: ElevenLabs lo envia en la cabecera X-Telephony-Secret al pedir /agent-context/{userId}.
    # Vacio = los webhooks responden 503 (cerrados). Obligatorio para usar la voz.
    webhook-secret: ${TELEPHONY_WEBHOOK_SECRET:}
    limits:
      per-number-cooldown-seconds: 60
      max-calls-per-hour: 20
    # userId (clientId) -> portfolioId. Sin entrada, el userId se interpreta directamente como portfolioId.
    portfolio-by-user:
      CLI-001: PF-001
  openjev:
    base-url: http://localhost:8080/v1/systemone
    timeout-ms: 5000
  ledger:
    # Foto exportada por OpenJEV (temporal). Ruta relativa al directorio de trabajo (backend-core-java/).
    mock-file: ../bank-simulator-mocks/api-json-responses/client_portfolio_jev.json
  tax-lots:
    # Lotes fiscales del modulo 2 (mock del broker). Se cargan al arrancar si el repositorio esta vacio.
    enabled: true
    mock-file: ../bank-simulator-mocks/api-json-responses/historical_lots.json
  baskets:
    # Agrupaciones de fondos (cestas / model portfolios) por cartera. Los pesos son RELATIVOS y se normalizan a
    # suma 1 (1,1,1 = tres fondos al 33,3 %). Solo fondos de la cartera; el efectivo no puede ir en una cesta.
    by-portfolio:
      PF-001:
        agrupacion-1:
          name: "Agrupación 1"
          description: "Renta variable global, EE. UU. y renta fija a partes iguales"
          weights:
            IE00B4L5Y983: 1   # iShares Core MSCI World
            IE00B3XXRP09: 1   # Vanguard S&P 500
            IE00B4WXJJ64: 1   # iShares Core Euro Govt Bond
        agrupacion-2:
          name: "Agrupación 2"
          description: "Cuatro fondos con distribución personalizada"
          weights:
            IE00B4L5Y983: 40  # iShares Core MSCI World
            IE00B3XXRP09: 30  # Vanguard S&P 500
            IE00B4WXJJ64: 20  # iShares Core Euro Govt Bond
            IE00B579F325: 10  # Invesco Physical Gold
  rebalancer:
    # Pesos objetivo por portfolioId. Suma 1.0; el efectivo es un peso mas (CASH:<moneda>).
    # Las claves con ':' necesitan notacion de corchetes para el binder de Spring.
    targets:
      PF-001:
        "[IE00B4L5Y983]": 0.35   # iShares Core MSCI World
        "[IE00B3XXRP09]": 0.20   # Vanguard S&P 500
        "[IE00B4WXJJ64]": 0.30   # iShares Core Euro Govt Bond
        "[IE00B579F325]": 0.10   # Invesco Physical Gold
        "[CASH:EUR]": 0.05
